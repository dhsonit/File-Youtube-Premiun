<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải Tài Liệu Hướng Dẫn</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 10px; font-weight: bold; }
        p { color: #666; font-size: 15px; line-height: 1.5; }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Tỉ lệ 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            margin: 20px 0;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }
        .timer-box {
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .countdown {
            font-size: 22px;
            font-weight: bold;
            color: #4f46e5;
            margin-top: 5px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s;
            cursor: pointer;
            border: none;
        }
        /* Nút đăng ký màu đỏ YouTube */
        .btn-sub {
            background-color: #ff0000;
            color: white;
            font-size: 16px;
        }
        .btn-sub:hover { background-color: #cc0000; }

        /* Nút tải tài liệu màu xanh */
        .btn-download {
            background-color: #10b981;
            color: white;
            padding: 12px 28px;
            font-size: 16px;
            display: inline-block;
            margin-top: 15px;
        }
        .btn-download:hover { background-color: #059669; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>ĐĂNG KÝ KÊNH ĐỂ ĐƯỢC CẤP QUYỀN TẢI FILE NHÉ</h2>
    <p>Vui lòng bấm nút <b>Đăng ký kênh</b> bên dưới để hệ thống cấp quyền và đếm ngược mở link tải file nhé!</p>

    <!-- Video YouTube (Tự động phát) -->
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/bnAwYfbCREw?autoplay=1&mute=1" 
                title="YouTube video player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
    </div>

    <!-- NÚT BẤM ĐĂNG KÝ -->
    <div class="timer-box" id="subBox">
        <p style="margin:0 0 10px 0; font-size:14px; color:#4b5563;">Vui lòng bấm đăng ký kênh</p>
        <button class="btn btn-sub" onclick="startCountdown()">
            🔴 ĐĂNG KÝ KÊNH
        </button>
    </div>

    <!-- KHU VỰC ĐẾM NGƯỢC (60 GIÂY) -->
    <div class="timer-box hidden" id="timerBox">
        <p style="margin:0; font-size:14px; color:#4b5563;">Cảm ơn bạn đã đăng ký! Nút tải file sẽ xuất hiện sau:</p>
        <div class="countdown" id="countdown">60 giây</div>
    </div>

    <!-- Nút tải Google Drive -->
    <a href="https://drive.google.com/drive/folders/1mKoVL1wjZp1KO5XF4H6TMxHq542wXPQM" id="downloadBtn" class="btn btn-download hidden" target="_blank">
        📥 TẢI FILE Ở ĐÂY
    </a>
</div>

<script>
    function startCountdown() {
        // 1. Mở link đăng ký kênh ra tab mới
        window.open('https://www.youtube.com/@dhsonit?sub_confirmation=1', '_blank');

        // 2. Ẩn nút đăng ký
        document.getElementById('subBox').classList.add('hidden');

        // 3. Hiện đồng hồ đếm ngược 60 giây
        document.getElementById('timerBox').classList.remove('hidden');

        let timeLeft = 60; 
        const countdownEl = document.getElementById('countdown');
        const timerBox = document.getElementById('timerBox');
        const downloadBtn = document.getElementById('downloadBtn');

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.innerText = timeLeft + " giây";

            if (timeLeft <= 0) {
                clearInterval(timer);
                timerBox.classList.add('hidden'); // Ẩn đếm ngược
                downloadBtn.classList.remove('hidden'); // Hiện nút tải file
            }
        }, 1000);
    }
</script>

</body>
</html>
