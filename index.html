<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải Tài Liệu Hướng Dẫn</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 15px; line-height: 1.5; }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Tỉ lệ 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            margin: 20px 0;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }
        .timer-box {
            background: #eef2ff;
            border: 1px solid #c7d2fe;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .countdown {
            font-size: 22px;
            font-weight: bold;
            color: #4f46e5;
            margin-top: 5px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s;
        }
        /* Nút đăng ký màu đỏ YouTube */
        .btn-sub {
            background-color: #ff0000;
            color: white;
        }
        .btn-sub:hover { background-color: #cc0000; }

        /* Nút tải tài liệu màu xanh */
        .btn-download {
            background-color: #10b981;
            color: white;
            padding: 12px 28px;
            font-size: 16px;
            display: inline-block;
            margin-top: 15px;
        }
        .btn-download:hover { background-color: #059669; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>XEM VIDEO ĐỂ LẤY LINK TẢI TÀI LIỆU</h2>
    <p>Vui lòng xem video trong lúc đồng hồ đếm ngược và ủng hộ kênh của mình nhé!</p>

    <!-- Video YouTube -->
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/bnAwYfbCREw" 
                title="YouTube video player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
        </iframe>
    </div>

    <!-- KHU VỰC ĐẾM NGƯỢC & NÚT ĐĂNG KÝ -->
    <div class="timer-box" id="timerBox">
        <p style="margin:0; font-size:14px; color:#4b5563;">Nút tải tài liệu sẽ xuất hiện sau:</p>
        <div class="countdown" id="countdown">30 giây</div>

        <div class="action-buttons">
            <a href="https://www.youtube.com/@dhsonit?sub_confirmation=1" class="btn btn-sub" target="_blank">
                🔴 Đăng ký kênh ủng hộ mình nhé
            </a>
        </div>
    </div>

    <!-- Nút tải Google Drive (Bị ẩn cho đến khi đếm về 0) -->
    <a href="https://drive.google.com/drive/folders/1mKoVL1wjZp1KO5XF4H6TMxHq542wXPQM" id="downloadBtn" class="btn btn-download hidden" target="_blank">
        📥 TẢI TÀI LIỆU NGAY
    </a>
</div>

<script>
    // Cấu hình thời gian đếm ngược: 30 giây
    let timeLeft = 30; 

    const countdownEl = document.getElementById('countdown');
    const timerBox = document.getElementById('timerBox');
    const downloadBtn = document.getElementById('downloadBtn');

    const timer = setInterval(() => {
        timeLeft--;
        countdownEl.innerText = timeLeft + " giây";

        if (timeLeft <= 0) {
            clearInterval(timer);
            timerBox.classList.add('hidden'); // Ẩn hộp đếm ngược và nút Đăng ký khi hết giờ
            downloadBtn.classList.remove('hidden'); // Hiện nút tải tài liệu
        }
    }, 1000);
</script>

</body>
</html>
